# The peer refresh tooling has tests; without this workflow nothing runs them
# and a regression would only surface on the next scheduled refresh.
name: test-peers-scripts

on:
  pull_request:
    paths:
      - "scripts/peers/**"
      - ".github/workflows/test-peers-scripts.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/peers/**"
      - ".github/workflows/test-peers-scripts.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/peers/verifypeer/go.mod

      - name: gofmt
        working-directory: scripts/peers/verifypeer
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: scripts/peers/verifypeer
        run: go vet ./...

      - name: go test
        working-directory: scripts/peers/verifypeer
        run: go test -race ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: shellcheck
        run: shellcheck scripts/peers/fetch-filter.sh

      - name: bats
        run: bats scripts/peers
